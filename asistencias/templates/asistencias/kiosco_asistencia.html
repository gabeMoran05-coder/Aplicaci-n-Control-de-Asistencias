<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if modo_profesor %}Profesor{% else %}Kiosco{% endif %} - AsisteEscolar</title>
    <style>
        :root{--bg:#07131a;--panel:#0e2530;--line:#21495a;--blue:#1177ad;--ink:#fff;--muted:#9bc9dc;--ok:#d9fbe8;--ok-ink:#087247;--warn:#fff1cc;--warn-ink:#8a5c00;--bad:#ffe2e2;--bad-ink:#a82018}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px;gap:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:24px;font-weight:900}.brand span{display:block;color:var(--muted);font-size:14px}.clock{text-align:right;font-size:30px;font-weight:900}.clock small{display:block;color:var(--muted);font-size:13px}.scanner{display:grid;place-items:center}.phone{width:min(100%,460px);min-height:660px;border:1px solid var(--line);border-radius:28px;background:#f7f9fc;color:#101828;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.35);position:relative}.hero{padding:18px;background:linear-gradient(#ffd8e2,#ff7e9e);text-align:center}.hero h1{margin:12px 0 4px;font-size:34px;letter-spacing:0}.hero p{margin:0;font-weight:900}.camera-wrap{margin:18px;border-radius:18px;background:#111827;overflow:hidden;aspect-ratio:1;position:relative}video{width:100%;height:100%;object-fit:cover}.target{position:absolute;inset:12%;border:4px solid rgba(255,255,255,.78);border-radius:18px}.panel{padding:0 18px 18px}.status{padding:14px;border:1px solid #dde5ee;border-radius:8px;background:white;font-weight:900}.status span{display:block;color:#667085;font-size:13px;margin-top:4px}.manual{display:flex;gap:8px;margin-top:12px}.manual input{min-width:0;flex:1;border:1px solid #d8dee8;border-radius:8px;padding:13px;font-size:16px}.manual button{border:0;border-radius:8px;background:var(--blue);color:white;font-weight:900;padding:0 14px}.bubble{position:absolute;left:16px;right:16px;bottom:18px;transform:translateY(140%);transition:transform .22s ease;padding:16px;border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.24);font-weight:900}.bubble.show{transform:translateY(0)}.bubble.ok{background:var(--ok);color:var(--ok-ink)}.bubble.warn{background:var(--warn);color:var(--warn-ink)}.bubble.bad{background:var(--bad);color:var(--bad-ink)}.bubble strong{display:block;font-size:20px;line-height:1.1}.bubble span{display:block;margin-top:6px}.footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:800}.hidden-reader{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0}@media(max-width:560px){.app{padding:10px}.top{align-items:flex-start}.clock{font-size:24px}.phone{min-height:calc(100vh - 104px);border-radius:22px}.camera-wrap{margin:14px}.hero h1{font-size:30px}}
    </style>
</head>
<body>
    <main class="app">
        <header class="top"><div class="brand">AsisteEscolar <span>{% if modo_profesor %}App del profesor{% else %}Kiosco QR / NFC{% endif %}</span></div><div class="clock" id="clock">--:--<small id="date">--</small></div></header>
        <section class="scanner"><div class="phone"><div class="hero"><p>Escaneo continuo</p><h1>Asistencia</h1><p>Sin cambiar de pantalla</p></div><div class="camera-wrap"><video id="video" autoplay muted playsinline></video><div class="target"></div></div><div class="panel"><div class="status" id="status">Sistema listo<span>Escanea el QR, acerca NFC o escribe el codigo.</span></div><form class="manual" id="manualForm"><input id="manualInput" autocomplete="off" placeholder="Codigo QR / NFC"><button type="submit">Registrar</button></form></div><div class="bubble" id="bubble"><strong id="bubbleTitle"></strong><span id="bubbleText"></span></div></div></section>
        <footer class="footer"><span><a style="color:inherit" href="{% url 'asistencias:control' %}">Panel</a></span><span id="cameraState">Iniciando camara...</span></footer>
    </main>
    <input class="hidden-reader" id="readerInput" autocomplete="off" inputmode="none">
    <script>
        const video=document.getElementById('video'),state=document.getElementById('cameraState'),statusBox=document.getElementById('status'),bubble=document.getElementById('bubble'),bubbleTitle=document.getElementById('bubbleTitle'),bubbleText=document.getElementById('bubbleText'),manualForm=document.getElementById('manualForm'),manualInput=document.getElementById('manualInput'),readerInput=document.getElementById('readerInput'),clock=document.getElementById('clock'),dateEl=document.getElementById('date');let busy=false,lastCode='',lastAt=0,hideTimer;
        function cookie(name){const value=`; ${document.cookie}`;const parts=value.split(`; ${name}=`);if(parts.length===2)return parts.pop().split(';').shift()}
        function tick(){const n=new Date();clock.firstChild.nodeValue=n.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});dateEl.textContent=n.toLocaleDateString('es-MX',{weekday:'long',day:'2-digit',month:'long'})}setInterval(tick,1000);tick();
        function show(kind,title,text){clearTimeout(hideTimer);bubble.className=`bubble ${kind} show`;bubbleTitle.textContent=title;bubbleText.textContent=text;statusBox.innerHTML=`${title}<span>${text}</span>`;hideTimer=setTimeout(()=>bubble.classList.remove('show'),4200)}
        async function register(code){code=(code||'').trim();if(!code)return;const now=Date.now();if(busy||(code===lastCode&&now-lastAt<3500))return;busy=true;lastCode=code;lastAt=now;try{const r=await fetch("{% url 'asistencias:registrar_kiosco' %}",{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':cookie('csrftoken')},body:JSON.stringify({codigo:code})});const data=await r.json();if(r.ok&&data.tipo==='registrado')show('ok',`✓ ${data.alumno}`,`Asistio ${data.grupo} a las ${data.hora}. WhatsApp programado.`);else if(r.ok)show('warn',`↺ ${data.alumno}`,`Ya tenia asistencia hoy a las ${data.hora}.`);else show('bad','Credencial no registrada',data.codigo||code)}catch(e){show('bad','Sin conexion','No se pudo registrar la asistencia.')}finally{busy=false;manualInput.value='';readerInput.value='';readerInput.focus({preventScroll:true})}}
        manualForm.addEventListener('submit',e=>{e.preventDefault();register(manualInput.value)});readerInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();register(readerInput.value)}});document.addEventListener('click',()=>readerInput.focus({preventScroll:true}));
        async function startCamera(){if(!('BarcodeDetector' in window)){state.textContent='Camara sin detector QR; usa lector o codigo manual.';return}try{const detector=new BarcodeDetector({formats:['qr_code']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;state.textContent='Camara lista';async function scan(){if(video.readyState>=2){const codes=await detector.detect(video).catch(()=>[]);if(codes.length)register(codes[0].rawValue)}requestAnimationFrame(scan)}scan()}catch(e){state.textContent='Permiso de camara pendiente o no disponible.'}}
        startCamera();readerInput.focus({preventScroll:true});
    </script>
</body>
</html>
