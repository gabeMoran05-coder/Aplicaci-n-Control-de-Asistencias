<aside class="dashboard-sidebar" aria-label="Secciones de Direccion">
    <div class="sidebar-title">Panel escolar</div>
    <nav class="sidebar-links" aria-label="Secciones">
        <a{% if active_section == 'alumnos' %} class="active" aria-current="page"{% endif %} href="{% url 'asistencias:control' %}">Alumnos</a>
        <a{% if active_section == 'importar' %} class="active" aria-current="page"{% endif %} href="{% url 'asistencias:importar_lista' %}">Importar listas</a>
        <a{% if active_section == 'ciclos' %} class="active" aria-current="page"{% endif %} href="{% url 'asistencias:ciclos_escolares' %}">Ciclos escolares</a>
        <a{% if active_section == 'calendario' %} class="active" aria-current="page"{% endif %} href="{% url 'asistencias:calendario_escolar' %}">Calendario</a>
        <a{% if active_section == 'reporte' %} class="active" aria-current="page"{% endif %} href="{% url 'asistencias:reporte_ausencias' %}">Ausencias</a>
        <a{% if active_section == 'cuentas' %} class="active" aria-current="page"{% endif %} href="{% url 'asistencias:cuentas_alumnos' %}">Accesos</a>
        <a href="{% url 'asistencias:prefectos' %}">Prefectos</a>
        {% if request.user.is_staff %}<a href="/admin/">Administracion</a>{% endif %}
    </nav>
    <form method="post" action="{% url 'asistencias:direccion_logout' %}">{% csrf_token %}<button type="submit">Cerrar sesion</button></form>
</aside>
