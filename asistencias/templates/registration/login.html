<!doctype html>
{% load static %}
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prefectura - Iniciar sesión</title>
    <meta name="theme-color" content="#eaf3f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Prefectura">
    <link rel="manifest" href="{% url 'asistencias:prefecto_manifest' %}">
    <link rel="apple-touch-icon" href="{% static 'asistencias/prefectura-apple-touch-icon.png' %}">
    <style>
        :root { --blue:#1177ad; --bg:#f4f7fa; --panel:#ffffff; --ink:#111827; --muted:#667085; --line:#d8dee8; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--ink); }
        .login { width: min(100%, 430px); overflow: hidden; border:1px solid var(--line); border-radius: 8px; background: var(--panel); }
        .head { padding: 24px; text-align: center; background: #eaf3f7; }
        .check { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 999px; background: #d9fbe8; color: #087247; font-size: 38px; font-weight: 900; }
        h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: 0; font-weight:600; }
        .head p { margin: 8px 0 0; font-weight: 400; }
        form { display: grid; gap: 14px; padding: 24px; }
        label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; }
        input { width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 8px; padding: 0 13px; font-size: 18px; }
        button { min-height: 52px; border: 0; border-radius: 8px; background: var(--blue); color: white; font-size: 17px; font-weight: 600; cursor: pointer; }
        .error { padding: 12px; border-radius: 8px; background: #ffe2e2; color: #9b1c1c; font-weight: 400; line-height: 1.35; }
        .back { display: block; padding: 0 24px 24px; color: var(--muted); text-align: center; font-weight: 400; text-decoration: none; }
    </style>
</head>
<body>
    <main class="login">
        <section class="head">
            <div class="check">✓</div>
            <h1>Prefectura</h1>
            <p>Escaneo de asistencia</p>
        </section>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="error">Usuario o contraseña incorrectos.</div>
            {% endif %}
            <input type="hidden" name="next" value="{{ next }}">
            <label>Usuario {{ form.username }}</label>
            <label>Contraseña {{ form.password }}</label>
            <button type="submit">Entrar</button>
        </form>
        <a class="back" href="{% url 'asistencias:control' %}">Volver al panel</a>
    </main>
</body>
</html>
